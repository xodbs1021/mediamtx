name: nightly_binaries

# PokeClip downstream: upstream publishing is manual-only here
# (no DockerHub secrets in this fork, and our tags must not cut upstream releases).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly_binaries:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: make binaries

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: binaries
